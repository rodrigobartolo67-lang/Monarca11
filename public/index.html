<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traductor Legal de Archivos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Traductor legal de archivos</h1>
      <p>
        Sube documentos legales y traduce contenido entre múltiples idiomas. Diseñado para manejar archivos grandes.
      </p>

      <form id="translate-form">
        <label>
          Idioma de origen
          <input type="text" name="sourceLanguage" value="auto" placeholder="Ej: en, fr, de" />
        </label>

        <label>
          Idioma de destino
          <input type="text" name="targetLanguage" value="es" placeholder="Ej: es, en, pt" required />
        </label>

        <label>
          Archivo (.txt por ahora)
          <input type="file" name="file" accept=".txt,.md,.csv,.json" required />
        </label>

        <button type="submit">Traducir archivo</button>
      </form>

      <section>
        <h2>Resultado</h2>
        <pre id="output">Aquí aparecerá la traducción.</pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
